<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>반려동물 AI 웰니스 케어 - 프로토타입 뷰어</title>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    <style>
  /* 스크롤 기능은 100% 유지하면서 브라우저 스크롤바 UI만 투명하게 숨김 */
  html, body {
    -ms-overflow-style: none; /* IE, Edge */
    scrollbar-width: none; /* Firefox */
  }
  html::-webkit-scrollbar, body::-webkit-scrollbar {
    display: none; /* Chrome, Safari, Opera */
  }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background: #f0ede6; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; color: #2D3142; }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; color: #ac3323; margin-bottom: 6px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .header p { font-size: 14px; color: #71778E; }
        .nav-tabs { width: 410px; max-width: 100%; display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; background: #fff; padding: 6px; border-radius: 16px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); margin-bottom: 16px; }
        
        
        .phone-wrapper { width: 410px; max-width: 100%; height: 860px; background: #fff; border-radius: 44px; box-shadow: 0 25px 60px rgba(0,0,0,0.15), 0 0 0 10px #2D3142; overflow: hidden; position: relative; display: flex; flex-direction: column; }
        .phone-notch { position: absolute; top: 0; left: 50%; transform: translateX(-50%); width: 140px; height: 26px; background: #2D3142; border-bottom-left-radius: 16px; border-bottom-right-radius: 16px; z-index: 100; }
        iframe { width: 100%; height: 100%; border: none; flex: 1; }
    </style>
</head>
<body>

    <div class="phone-wrapper">
        <div class="phone-notch"></div>
        <iframe id="app-frame" src="01_dashboard.html"></iframe>
    </div>

</html>
